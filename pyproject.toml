[project]
name = "csvq"
version = "0.1.0"
description = "Query and transform CSV from your terminal. Zero dependencies, pure Python stdlib."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mahmoud Ahmed" }]

[project.scripts]
csvq = "csvq:main"

[tool.pytest.ini_options]
testpaths = ["tests"]